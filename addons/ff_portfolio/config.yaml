name: "FF Dimmen"
version: "0.1.0"
slug: ff_portfolio
description: "Portfolio. Naar buiten alleen de landing. Beheer via het paneel."
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
hostname: local-ff-portfolio
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
webui: http://[HOST]:[PORT:8080]
ports:
  8080/tcp: 8180
  9099/tcp: 9199
ports_description:
  8080/tcp: "Site (host 8180, Cloudflare: http://local-ff-portfolio:8180)"
  9099/tcp: "Deploy-API fallback (host 9199, LAN)"
options:
  admin_token: "change-me-now"
  public_base: "http://local-ff-portfolio:8180"
schema:
  admin_token: password
  public_base: str
